[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hack-pay"
version = "0.1.0"
description = "Make any HTTP endpoint payable with x402 and Hedera"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.15"
keywords = ["hedera", "x402", "payments", "fastapi", "micropayments", "hbar"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.111",
    "starlette>=0.37",
]
redis = [
    "redis>=5.0",
]
# testnet extra: Hiero SDK dependency TBD — package name on PyPI not yet confirmed.
# Will be added once https://github.com/hedera-agent-commerce-kit/hack/issues is resolved.
testnet = []

# ── uv dependency groups (PEP 735) ─────────────────────────────────────────
# Used by: uv sync --group dev / uv sync --group lint
# These are development-only; not installed by end users.
[dependency-groups]
lint = [
    "ruff>=0.4",
]
dev = [
    "hack-pay[fastapi]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit",
    "import-linter",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/hedera-agent-commerce-kit/hack"
Repository = "https://github.com/hedera-agent-commerce-kit/hack"
Issues = "https://github.com/hedera-agent-commerce-kit/hack/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "testnet: marks tests requiring real Hedera testnet credentials (deselect with -m 'not testnet')",
    "slow: marks slow tests",
]

[tool.coverage.run]
source = ["hack_pay"]
omit = ["tests/*", "examples/*"]

[tool.importlinter]
root_packages = ["hack_pay"]

[[tool.importlinter.contracts]]
name = "Core does not import adapters"
type = "forbidden"
source_modules = ["hack_pay.core"]
forbidden_modules = ["hack_pay.adapters", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "x402 types module has no network I/O"
type = "forbidden"
source_modules = ["hack_pay.x402"]
forbidden_modules = ["httpx", "hack_pay.adapters", "hack_pay.providers.hedera"]